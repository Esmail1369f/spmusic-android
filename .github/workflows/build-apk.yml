name: Build SPMusic APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.sahareh.spmusic --project-name spmusic
      - name: Add audio permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          i = s.find('>')
          permissions = '    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n'
          if 'android.permission.READ_MEDIA_AUDIO' not in s:
              s = s[:i+1] + '\n' + permissions + s[i+1:]
          p.write_text(s)
          PY
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze
        continue-on-error: true
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPMusic-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
