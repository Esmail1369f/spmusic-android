name: Build SPMusic APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.sahareh.spmusic --project-name spmusic
      - name: Configure SPMusic launcher icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          res = Path('android/app/src/main/res')
          drawable = res / 'drawable'
          drawable.mkdir(parents=True, exist_ok=True)
          icon = drawable / 'spmusic_icon.xml'
          icon.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#090A0F" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#D8B56A" android:strokeWidth="2.5" android:fillColor="#00000000"
                  android:pathData="M17,54a37,37 0,1 0,74 0a37,37 0,1 0,-74 0"/>
              <path android:strokeColor="#F4DEA5" android:strokeWidth="4" android:strokeLineCap="round"
                  android:fillColor="#00000000" android:pathData="M29,51v-5a25,25 0,0 1,50 0v5"/>
              <path android:fillColor="#D8B56A" android:pathData="M27,49h9v23h-9zM72,49h9v23h-9z"/>
              <path android:fillColor="#F4DEA5" android:pathData="M43,37h8v34h-8zM55,30h8v41h-8z"/>
              <path android:fillColor="#D8B56A" android:pathData="M67,42l18,12 -18,12z"/>
          </vector>
          """)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android:icon=' in text:
              text = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/spmusic_icon"', text, count=1)
          else:
              text = re.sub(r'<application\\b', '<application android:icon="@drawable/spmusic_icon"', text, count=1)
          manifest.write_text(text)
          print('Configured the SPMusic dark-and-gold launcher icon.')
          PY
      - name: Remove stale generated widget test
        run: |
          # flutter create generates a template test that references MyApp,
          # while this project uses SPMusicApp and needs no template test.
          rm -f test/widget_test.dart
      - name: Disable incompatible Android Gradle DSL
        run: |
          echo 'android.newDsl=false' >> android/gradle.properties
          echo 'android.builtInKotlin=false' >> android/gradle.properties
      - name: Align Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('android/app').glob('build.gradle*'):
              s = p.read_text()
              s = s.replace('JavaVersion.VERSION_11', 'JavaVersion.VERSION_17')
              s = s.replace('VERSION_11', 'VERSION_17')
              p.write_text(s)
              print(f'Updated JVM target settings in {p}')
          PY
      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('android').rglob('build.gradle*'):
              s = p.read_text()
              if p.suffix == '.kts':
                  updated = re.sub(r'compileSdk(?:Version)?\s*(?:=\s*)?(?:flutter\.compileSdkVersion|\d+)', 'compileSdk = 36', s)
              else:
                  updated = re.sub(r'compileSdk(?:Version)?\s*(?:=\s*)?(?:flutter\.compileSdkVersion|\d+)', 'compileSdkVersion 36', s)
              if updated != s:
                  p.write_text(updated)
                  print(f'Updated compile SDK in {p}')
          PY
      - name: Add audio permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          import re
          permissions = '    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n'
          if 'android.permission.READ_MEDIA_AUDIO' not in s:
              match = re.search(r'<manifest\b[^>]*>', s)
              if not match:
                  raise SystemExit('Could not find opening <manifest> tag')
              i = match.end()
              s = s[:i] + '\n' + permissions + s[i:]
          p.write_text(s)
          PY
      - name: Resolve packages
        run: flutter pub get
      - name: Patch legacy audio plugin namespace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = list((Path.home() / '.pub-cache/hosted/pub.dev').glob('on_audio_query_android-*/android'))
          if not roots:
              raise SystemExit('on_audio_query_android plugin directory not found')
          for root in roots:
              gradle = root / 'build.gradle'
              manifest = root / 'src/main/AndroidManifest.xml'
              if not gradle.exists() or not manifest.exists():
                  continue
              text = gradle.read_text()
              # Keep this legacy plugin aligned with the app's compile SDK.
              text = re.sub(r'compileSdk(?:Version)?\s*(?:=\s*)?(?:flutter\.compileSdkVersion|\d+)', 'compileSdkVersion 36', text)
              if 'namespace ' in text:
                  gradle.write_text(text)
                  print(f'Updated compile SDK in {gradle}')
                  continue
              xml = manifest.read_text()
              match = re.search('package="([^"]+)"', xml)
              namespace = match.group(1) if match else 'com.lucasjosino.on_audio_query'
              if 'android {' not in text:
                  raise SystemExit(f'Could not find android block in {gradle}')
              text = text.replace('android {', 'android {\n    namespace "' + namespace + '"', 1)
              gradle.write_text(text)
              print(f'Added namespace {namespace} to {gradle}')
          # Force Kotlin and Java compile targets to match in the legacy audio plugin.
          for root in roots:
              gradle = root / 'build.gradle'
              if not gradle.exists():
                  continue
              text = gradle.read_text()
              if 'tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile)' not in text:
                  text += '\n\ntasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {\n    kotlinOptions { jvmTarget = \'11\' }\n}\n'
                  gradle.write_text(text)
                  print(f'Aligned Kotlin JVM target to 11 in {gradle}')
          PY
      - name: Analyze Dart source
        run: flutter analyze
      - name: Build optimized release APKs (one per CPU architecture)
        run: flutter build apk --release --split-per-abi
      - name: Upload optimized APKs
        uses: actions/upload-artifact@v4
        with:
          name: SPMusic-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
